[package]
name = "yell-guard"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
cpal = "0.15"
ctrlc = "3.0"
dirs = "5.0"
notify-rust = "4.11"
rodio = "0.19"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
