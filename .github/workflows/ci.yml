name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-test-and-smoke:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --verbose

      - name: Test
        run: cargo test --verbose

      - name: CLI help smoke check
        shell: bash
        run: |
          cargo run -- --help
          cargo run -- run --help
          cargo run -- stats --help

      - name: Stats smoke check
        shell: bash
        run: |
          cargo run -- stats --log-path "$RUNNER_TEMP/yell-guard-events.log"

      - name: Run smoke check (CI-safe)
        shell: bash
        continue-on-error: true
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "Windows CI does not provide a microphone; this is a startup smoke check only."
            cargo run -- run --log-path "$RUNNER_TEMP/yell-guard-events.log" --threshold -18 --cooldown-ms 3000 || true
          else
            echo "This platform is headless; we only confirm the app starts up and exits cleanly when the mic is unavailable."
            timeout 15s cargo run -- run --log-path "$RUNNER_TEMP/yell-guard-events.log" --threshold -18 --cooldown-ms 3000 || true
          fi
